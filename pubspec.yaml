name: smartcart
description: SmartCart - compara menos, decide mejor y compra de forma inteligente.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.2.1
  get_it: ^8.0.3
  file_picker: ^13.3.3
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  permission_handler: 12.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/avatars/